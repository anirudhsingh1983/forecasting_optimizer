[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[project]
name = "forecasting_optimizer"
version = "0.1.0"
description = "Optimize forecasting pipelines and model hyperparameters."
readme = "README.md"
requires-python = ">=3.9,<3.14"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
authors = [
    {name = "Anirudh Singh", email = "anirudhsingh1983@gmail.com"},
]
maintainers = [
    {name = "Anirudh Singh", email = "anirudhsingh1983@gmail.com"},
]
keywords = ["forecasting", "hyperparameter optimization", "time series"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "google-cloud-bigquery[bqstorage,pandas]",
    "google-cloud-bigquery-storage",
    "h2o",
    "lightgbm",
    "matplotlib",
    "numpy",
    "optuna",
    "pandas",
    "pmdarima",
    "protobuf",
    "scikit-learn",
    "scipy",
    "sktime",
    "tables",
    "tensorflow",
    "tqdm",
    "xgboost",
    "yfinance",
]

[project.scripts]
forecasting-optimizer = "forecasting_optimizer.__main__:main"

[dependency-groups]
dev = [
    "black",
    "pylint",
]

[project.urls]
Homepage = "https://github.com/anirudhsingh1983/forecasting_optimizer"
Documentation = "https://github.com/anirudhsingh1983/forecasting_optimizer/blob/main/README.md"
Repository = "https://github.com/anirudhsingh1983/forecasting_optimizer"

[tool.uv]
package = true

[tool.black]
line-length = 80
target-version = ["py39"]

[tool.pylint.format]
max-line-length = 80

[tool.pylint.main]
py-version = "3.9"
